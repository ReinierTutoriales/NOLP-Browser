name: Security scanning
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit (locked)
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependency lockfile
        run: cargo audit --deny warnings

  secrets:
    name: Gitleaks tracked history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install reviewed Gitleaks release
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan repository history and working tree
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --exit-code 1 --log-opts="--all" .

  codeql:
    name: CodeQL Python static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
        with:
          languages: python
          queries: security-extended
      - name: Analyze Python code
        uses: github/codeql-action/analyze@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
