name: Firefox foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_firefox:
        description: 'Build Firefox UI with Mozilla artifact mode'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and bootstrap script
        run: |
          bash -n scripts/bootstrap-firefox.sh
          bash -n scripts/smoke-firefox.sh
          bash -n scripts/smoke-gecko-navigation.sh
          bash -n scripts/run-nolp-desktop.sh
          python3 -m unittest discover -s tests -p 'test_desktop_launcher.py' -v
          python3 -m unittest discover -s tests -p 'test_firefox_chrome_overlay.py' -v
          python3 -m unittest discover -s tests -p 'test_nolp_theme_selector.py' -v
          python3 -m unittest discover -s tests -p 'test_nolp_branding.py' -v
          node tests/nolp-theme-runtime.mjs
          python3 - <<'PY'
          import pathlib, re, tomllib
          data=tomllib.loads(pathlib.Path("engine/upstream-manifest/firefox.toml").read_text())
          rev=data["firefox"]["revision"]
          assert re.fullmatch(r"[0-9a-f]{40}",rev), "Firefox revision must be immutable SHA"
          assert data["firefox"]["source"] == "https://github.com/mozilla-firefox/firefox"
          assert data["firefox"]["version"] == "159.0.1"
          assert data["firefox"]["release_tag"] == "FIREFOX_159_0_1_RELEASE"
          print("Manifest and shell syntax validated:",rev)
          PY

  ui-artifact-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_firefox
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check disk capacity
        run: |
          df -h .
          free -h
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3 python3-venv git make curl
      - name: Fetch pinned upstream
        run: |
          REV=$(python3 -c 'import tomllib;print(tomllib.load(open("engine/upstream-manifest/firefox.toml","rb"))["firefox"]["revision"])')
          FIREFOX_REVISION="$REV" bash scripts/bootstrap-firefox.sh
      - name: Verify pinned upstream version
        run: |
          test "$(cat .upstream/firefox/browser/config/version.txt)" = "159.0.1"
          bash scripts/smoke-firefox.sh
      - name: Apply and verify NOLP Firefox chrome overlay
        run: |
          python3 scripts/apply-firefox-chrome.py --firefox-dir .upstream/firefox
          python3 scripts/apply-firefox-chrome.py --firefox-dir .upstream/firefox --check
      - name: Apply and verify native NOLP theme picker
        run: |
          python3 scripts/apply-nolp-theme-selector.py --firefox-dir .upstream/firefox
          python3 scripts/apply-nolp-theme-selector.py --firefox-dir .upstream/firefox --check
      - name: Install NOLP native application branding
        run: |
          python3 -m pip install --break-system-packages "Pillow>=11,<13"
          python3 scripts/apply-nolp-branding.py --firefox-dir .upstream/firefox
          python3 scripts/apply-nolp-branding.py --firefox-dir .upstream/firefox --check
      - name: Configure Mozilla UI artifact build
        run: |
          cat > .upstream/firefox/mozconfig <<'EOF'
          ac_add_options --enable-artifact-builds
          ac_add_options --with-branding=browser/branding/nolp
          ac_add_options --disable-debug
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-nolp
          EOF
      - name: Bootstrap Mozilla artifact build dependencies
        working-directory: .upstream/firefox
        run: ./mach bootstrap --application-choice browser_artifact_mode
      - name: Build patched Firefox UI resources
        working-directory: .upstream/firefox
        run: ./mach build
      - name: Smoke test built Firefox executable
        working-directory: .upstream/firefox
        env:
          MOZ_HEADLESS: '1'
        run: |
          ./mach run --version
          echo 'Version smoke passed; no web navigation verified.'
      - name: Render local HTML in isolated Gecko profile
        working-directory: .
        run: bash scripts/smoke-gecko-navigation.sh
      - name: Capture NOLP preferences UI in Gecko
        working-directory: .upstream/firefox
        env:
          MOZ_HEADLESS: '1'
        run: |
          mkdir -p ../../ui-validation
          PROFILE="$(mktemp -d)"
          trap 'rm -rf "$PROFILE"' EXIT
          timeout 90s ./mach run --headless --no-remote --profile "$PROFILE" \
            --window-size 1280,900 --screenshot "$GITHUB_WORKSPACE/ui-validation/preferences.png" \
            'about:preferences'
          python3 - <<'PY'
          import pathlib, struct
          image = pathlib.Path("../../ui-validation/preferences.png").read_bytes()
          assert image[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10)), "Preferences screenshot missing or invalid"
          width, height = struct.unpack(">II", image[16:24])
          assert width >= 800 and height >= 600, (width, height)
          print(f"Preferences screenshot captured: {width}x{height}")
          PY
      - name: Verify real NOLP theme selection and restart persistence
        run: |
          python3 -m venv .venv-nolp-ui
          .venv-nolp-ui/bin/pip install 'selenium==4.38.0'
          curl --fail --location --retry 3 \
            'https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz' \
            -o /tmp/nolp-geckodriver.tar.gz
          mkdir -p .tools/geckodriver
          tar -xzf /tmp/nolp-geckodriver.tar.gz -C .tools/geckodriver
          NOLP_FIREFOX_BINARY="$GITHUB_WORKSPACE/.upstream/firefox/obj-nolp/dist/bin/firefox" \
          NOLP_GECKODRIVER="$GITHUB_WORKSPACE/.tools/geckodriver/geckodriver" \
          NOLP_UI_ARTIFACTS="$GITHUB_WORKSPACE/ui-validation" \
            .venv-nolp-ui/bin/python tests/nolp_preferences_marionette.py
      - name: Upload NOLP preferences screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nolp-preferences-screenshot
          path: ui-validation/*.png
          if-no-files-found: ignore
      - name: Preserve failure diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          df -h . > diagnostics/disk.txt
          free -h > diagnostics/memory.txt
          find .upstream/firefox -maxdepth 3 -name 'config.log' -o -name 'build.log' > diagnostics/log-locations.txt 2>/dev/null || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
      - name: Report build metadata
        if: always()
        run: |
          git -C .upstream/firefox rev-parse HEAD || true
          echo "This is Mozilla artifact-mode UI validation, not a full Gecko compilation or signed NOLP release."
