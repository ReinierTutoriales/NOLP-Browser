name: Module boundaries
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    name: Validate module graph and lockfile inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-modules.py

  rust-format:
    name: Rust formatting (committed files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-build:
    name: Rust dependency resolution and compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate lockfile and workspace metadata
        run: cargo metadata --locked --offline --format-version 1 --no-deps > /dev/null
      - name: Verify Cargo-generated lockfile matches repository
        run: |
          cargo generate-lockfile --offline
          git diff --exit-code -- Cargo.lock
      - name: Compile all crates and test targets
        run: cargo check --workspace --all-targets --locked --offline

  rust-clippy:
    name: Rust Clippy strict
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  rust-tests:
    name: Rust unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked --offline

  python-tests:
    name: Offline Python network-policy tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -p 'test_network_policy.py' -v
