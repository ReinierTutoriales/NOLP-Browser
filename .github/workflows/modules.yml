name: Module boundaries
on:
  push:
    paths:
      - 'modules/**'
      - 'integration/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-modules.py'
      - 'tests/test_network_policy.py'
      - '.github/workflows/modules.yml'
  pull_request:
    paths:
      - 'modules/**'
      - 'integration/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/test_network_policy.py'
      - 'scripts/check-modules.py'
      - '.github/workflows/modules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate declared module boundaries
        run: python3 scripts/check-modules.py
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Normalize Rust formatting for CI compilation
        run: cargo fmt --all
      - name: Check formatting of normalized sources
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Test offline network policy prototype
        run: python3 -m unittest discover -s tests -p 'test_network_policy.py' -v
